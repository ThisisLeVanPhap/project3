spring:
  application:
    name: demo2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/global_admin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: admin123

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.app: DEBUG

python:
  llm:
    # Preferred deploy mode: call a standalone Python chatbot service.
    base-url: ${PYTHON_LLM_BASE_URL:}

    # Local fallback only. Set explicitly when running Spring without
    # PYTHON_LLM_BASE_URL.
    python-bin: ${PYTHON_BIN:python}
    model-server-dir: ${MODEL_SERVER_DIR:../chatbot}
    host: ${LLM_HOST:127.0.0.1}
    port-range-start: ${LLM_PORT_START:8101}
    port-range-end: ${LLM_PORT_END:8199}
    health-path: ${LLM_HEALTH_PATH:/healthz}
    uvicorn-module: ${LLM_UVICORN_MODULE:app.server:app}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:2000}
    response-timeout-ms: ${LLM_RESPONSE_TIMEOUT_MS:120000}
    startup-timeout-ms: ${LLM_STARTUP_TIMEOUT_MS:120000}

messenger:
  verify-token: ${MESSENGER_VERIFY_TOKEN:woodchat_secret}
  # page-access-token:
