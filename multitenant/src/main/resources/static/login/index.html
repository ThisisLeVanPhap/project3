<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Login</title>
    <link rel="stylesheet" href="/login/styles.css"/>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-head">
            <h2 class="login-title">Welcome back</h2>
            <div class="login-sub">Sign in to continue</div>
        </div>

        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" placeholder="Tenant name or admin" autocomplete="username"/>
        </div>

        <div class="form-group">
            <label for="code">Password</label>
            <input id="code" type="password" placeholder="Password" autocomplete="current-password"/>
        </div>

        <div class="login-actions">
            <button id="btn-tenant" type="button">Login as Tenant</button>
            <button id="btn-admin" type="button" class="secondary">Login as Admin</button>
        </div>

        <div id="msg" class="muted login-msg"></div>
    </div>
</div>

<script src="/login/app.js"></script>
</body>
</html>
